<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>スマファイト</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="スマファイト">

<style>
[hidden]{display:none!important}
:root{--bg:#0b0d12;--panel:#141821;--line:#2a3140;--fg:#e6efe8;--dim:#8a94a3;--lime:#c6ff3d;--mint:#5ff2e0;--crim:#e0304a;
  --ui:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;font-family:var(--ui);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;align-items:flex-start}
canvas{display:block;touch-action:none}
#rot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--lime);font:700 22px var(--ui);z-index:9}
#ov{position:fixed;inset:0;z-index:8;background:rgba(6,8,12,.96);overflow-y:auto;touch-action:pan-y;-webkit-user-select:text;user-select:text;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#mn{position:fixed;inset:0;z-index:7;background:radial-gradient(ellipse at 50% 30%,rgba(30,40,24,.96),rgba(6,8,12,.98));overflow-y:auto;touch-action:pan-y;display:flex;align-items:flex-start;justify-content:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#mn .in{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
#mn h1{font:900 italic 26px var(--ui);color:var(--lime);margin:4px 0 0;letter-spacing:.02em}
#mn h1 small{font:600 12px var(--ui);color:var(--dim);margin-left:8px;font-style:normal}
#mn h2{font-size:12px;letter-spacing:.08em;color:var(--mint);margin:4px 0 0;font-weight:700}
#mn .seg{display:flex;gap:6px;flex-wrap:wrap}
#mn .seg button{flex:1 1 0;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 14px var(--ui);padding:0 8px}
#mn .seg button[aria-pressed=true]{background:var(--lime);color:var(--bg);border-color:var(--lime)}
#mn .seg button:disabled{opacity:.35}
#mn .go{min-height:52px;border-radius:10px;border:0;background:var(--lime);color:var(--bg);font:900 18px var(--ui);flex:2 1 0}
#mn .sub{min-height:52px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:700 14px var(--ui);flex:1 1 0}
#mn .note{font-size:12px;color:var(--dim);line-height:1.5}
#mn .res{font:900 italic 34px var(--ui);text-align:center;margin:6px 0 0}
#mn button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#ov .in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#ov h2{font-size:13px;letter-spacing:.08em;color:var(--lime);margin:8px 0 0;font-weight:700}
#ov .row{display:flex;flex-direction:column;gap:6px}
#ov .lab{display:flex;justify-content:space-between;font-size:14px;gap:8px}
#ov .lab b{font-family:var(--mono);color:var(--mint);font-weight:600;font-variant-numeric:tabular-nums}
#ov .note{font-size:12px;color:var(--dim);line-height:1.55}
#ov .how{font-size:13px;line-height:1.7}
#ov .how b{color:var(--lime)}
#ov input[type=range]{width:100%;accent-color:var(--lime);height:28px}
#ov .seg{display:flex;gap:6px;flex-wrap:wrap}
#ov .seg button{flex:1 1 auto;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--ui);padding:0 10px}
#ov .seg button[aria-pressed=true]{background:var(--lime);color:var(--bg);border-color:var(--lime)}
#ov .top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(6,8,12,.97);padding-block:8px;z-index:1}
#ov .top strong{font-size:16px}
#ov .btn{min-height:40px;border-radius:8px;border:1px solid var(--lime);background:transparent;color:var(--lime);font:700 14px var(--ui);padding:0 14px}
#ov button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#ov .tbl{overflow-x:auto}
#ov table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
#ov th,#ov td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}
#ov th:first-child,#ov td:first-child{text-align:left}
#ov th{color:var(--dim);font-weight:600}
#ov textarea{width:100%;min-height:80px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:12px var(--mono);box-sizing:border-box}
</style>

      const want=L.kaku===1?P.sp>=100:L.kaku===2?(P.hp<E.hp||P.sp>=100):true;if(want){request({kind:'kaku',x:0,y:0});return}}

  const gw=Math.max(0,VSCFG.lv-1)*6;   // 段階が上がるほど、近い間合いでは先にガードを固める（読み）
  const T=near?[['guardW',gw],['poke',24],['low',14],['throw',d<50?14:0],['parry',8],['back',9],['wait',14],['up',5],['neko',c>=3?6:0],['crouch',6],['heavy',8]]

      if(v==='YUKI2'){if(dd<0.18||h<35||h>320)continue;const o=toRGB((h+165)%360,sat,l);a[i]=o[0];a[i+1]=o[1];a[i+2]=o[2];continue}
